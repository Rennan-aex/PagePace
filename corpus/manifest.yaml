# Manifest do corpus PÚBLICO. Preenchido na tarefa E0-T01b (o script `corpus:fetch` é da E1-T05).
# Regras: só material de domínio público ou licença aberta verificada (CORPUS.md, "Regras de licença").
# Nunca PDFs com copyright. Cada PDF é baixado uma única vez por PowerShell para corpus/public/ (ignorado).
#
# Esquema de cada entrada:
#   - id: n1-en-0001            # único, estável
#     level: N1                 # N1..N5
#     lang: en                  # pt | en
#     title: "..."
#     source_url: "https://..." # URL direta e estável do PDF (download)
#     fallback_urls: ["https://"] # opcional: URLs extras testadas em ordem se a primeira falhar
#     page_url: "https://..."   # página oficial onde a licença foi conferida
#     license: "CC BY 4.0"      # linha exata da licença (curta)
#     license_url: "https://..." # URL da licença citada em `license`
#     verified_on: "2026-10-04" # data da verificação da licença
#     pages: 548                # número de páginas
#     sha256: "<64 hex>"
#     features: [footnotes, two-column, hyphenation, equations, tagged, scanned]
#     golden: none              # ou caminho relativo em corpus/golden/
#     visibility: public
#
# Não usa `file` (ADR-014): aqui o arquivo vem de `source_url` e é baixado pelo script (E1-T05).
#
# Entradas sintéticas (ADR-037, E1-T07): `generated: true` não tem `source_url` —
# o PDF é construído a partir de packages/eval/src/specs.ts pelo
# `pnpm corpus:synthetic` (PDFs e gabaritos), e o `pnpm corpus:fetch` só o
# reconstrói se faltar. Ficam em corpus/public/synthetic/ (ignorado pelo git).

