name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token only needs to read the repository: checkout plus the release
# mirror of the blocked corpus PDFs (ADR-034).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ADR-032 rule 4: restore first, save right after the fetch (below) and
      # before the tests, so a failing test never throws the download away.
      # The key changes by itself whenever corpus/manifest.yaml changes.
      - name: Corpus cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('corpus/manifest.yaml') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version (E1-T00, ADR-022):
          # .nvmrc = package.json engines >= 24 = reports (spikes ran on Node 24).
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # ADR-032 rules 1-3: warm cache = zero requests; network errors, 5xx and
      # 429 are retried 3 times (1 s, 2 s) inside the script; a definitive
      # failure fails this step and turns the CI red. Never `continue-on-error`.
      - name: Fetch public corpus
        run: pnpm corpus:fetch
        env:
          # ADR-034: downloads the release mirror of the PDFs SciELO blocks;
          # the script sends this token to GitHub hosts only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Corpus cache (save)
        uses: actions/cache/save@v4
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('corpus/manifest.yaml') }}
      - run: pnpm test
      - run: pnpm check:no-pdf
      # Corpus evaluation gate (the "golden rule": no metric may regress).
      # Enabled automatically once the eval package ships its baseline (task E1-T08).
      - name: Corpus evaluation
        if: hashFiles('packages/eval/baseline.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm corpus:fetch
          pnpm eval --ci
