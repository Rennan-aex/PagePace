name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token only needs to read the repository (checkout). It is also handed to
# `pnpm corpus:fetch`: the SciELO PDFs are vendored and need no network
# (ADR-103), so today it is only used if a manifest URL ever lives on GitHub.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Pushes to main
# are never cancelled: every commit on main must finish its verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history is needed only by the commit e-mail policy below, which
      # diffs base.sha..head.sha (a shallow clone cannot see the base commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ADR-032 rule 4: restore first, save right after the fetch (below) and
      # before the tests, so a failing test never throws the download away.
      # The key changes by itself whenever corpus/manifest.yaml changes.
      - name: Corpus cache (restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('corpus/manifest.yaml') }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Single source of truth for the Node version (E1-T00, ADR-022):
          # .nvmrc = package.json engines >= 24 = reports (spikes ran on Node 24).
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The repository is public (ADR-110): every commit in the pull request
      # must use a GitHub noreply address, never a real e-mail.
      - name: Commit e-mail policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:emails "$BASE_SHA" "$HEAD_SHA"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # ADR-032 rules 1-3: warm cache = zero requests; network errors, 5xx and
      # 429 are retried 3 times (1 s, 2 s) inside the script; a definitive
      # failure fails this step and turns the CI red. Never `continue-on-error`.
      - name: Fetch public corpus
        run: pnpm corpus:fetch
        env:
          # Optional (ADR-103): the two SciELO PDFs are copied from
          # corpus/vendored/ with no request. The token stays for a URL on
          # GitHub (public or private manifest) and is only ever sent to
          # github.com hosts by the script.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Corpus cache (save)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('corpus/manifest.yaml') }}
      - run: pnpm test
      - run: pnpm check:no-pdf
      # Docs context budget (DOCS-T01): STATE.md <= 8 KB / 90 lines,
      # Handoff <= 15 lines, log = 2 sessions, AGENTS.md <= 10 KB and the
      # newest ADR <= 12 lines. Everything trimmed must go to
      # docs/extractor/archive/, never be deleted.
      - name: Docs budget
        run: pnpm check:docs
      # Corpus evaluation gate (the "golden rule", ADR-008): `pnpm eval --ci`
      # exits 1 when any metric is worse than packages/eval/baseline.json by
      # more than 0.002 absolute. The step only runs while the baseline exists,
      # so the gate turns itself on with the first `--update-baseline`.
      - name: Corpus evaluation
        if: hashFiles('packages/eval/baseline.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm corpus:fetch
          pnpm eval --ci
      # Benchmark gate (E8-T04, ADR-091): `pnpm bench --ci` prints a WARNING
      # (never a failure - the numbers are informational) when a metric is
      # more than 25% worse than packages/eval/bench-baseline.json; a
      # document error still fails the step. While the baseline does not
      # exist it just warns, so the gate turns itself on with the first
      # calibration committed from a CI artifact (ADR-091: time and RSS are
      # only comparable inside the same runner).
      - name: Bench (speed and memory)
        run: pnpm bench --ci --runs 3
      - name: Bench report (artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: packages/eval/out/bench.json
          if-no-files-found: ignore
